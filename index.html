```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오윤재 | 모바일 명함</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      background: #f5f7fb;
      color: #102a56;
    }

    .card {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: auto;
      padding: 52px 28px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #ffffff;
    }

    .profile {
      text-align: center;
    }

    .profile h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 14px;
    }

    .profile p {
      font-size: 19px;
      line-height: 1.6;
      font-weight: 500;
    }

    .works {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin: 50px 0;
    }

    .work {
      padding: 23px 20px;
      border: 1.5px solid #d8e0ed;
      border-radius: 18px;
      background: #f8faff;
    }

    .work .number {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 9px;
      opacity: 0.7;
    }

    .work p {
      font-size: 19px;
      line-height: 1.55;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .contact {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 16px;
      background: #102a56;
      color: white;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    .contact:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="profile">
      <h1>오윤재</h1>
      <p>대학생<br>읽고, 배우고, 생각하며<br>더 나은 삶의 방향을 탐구합니다.</p>
    </header>

    <section class="works">
      <article class="work">
        <div class="number">01</div>
        <p>여러 분야의 독서 탐독하며 삶을 대하는 태도와 지혜 배우기</p>
      </article>

      <article class="work">
        <div class="number">02</div>
        <p>회계와 세금을 배우며 자본 배분의 효율화 학습</p>
      </article>

      <article class="work">
        <div class="number">03</div>
        <p>다양한 지식 축적하며 사고 습관 기르기</p>
      </article>
    </section>

    <button class="contact" onclick="contactMe()">문의하기</button>
  </main>

  <script>
    function contactMe() {
      window.location.href = "mailto:";
    }
  </script>
</body>
</html>
```
